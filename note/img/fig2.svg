<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#b9933f"/>
</marker>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>
<text x="600" y="70" text-anchor="middle" font-size="30" fill="#2b2b2b" font-weight="bold">やることは、3つだけ</text>

<!-- step boxes -->
<rect x="60" y="140" width="280" height="140" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="200" y="200" text-anchor="middle" font-size="24" fill="#2b2622" font-weight="bold">① 人を登録する</text>
<text x="200" y="238" text-anchor="middle" font-size="18" fill="#6b6b6b">名前だけでもOK</text>

<line x1="345" y1="210" x2="425" y2="210" stroke="#b9933f" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="430" y="140" width="280" height="140" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="570" y="200" text-anchor="middle" font-size="24" fill="#2b2622" font-weight="bold">② 関係を選ぶ</text>
<text x="570" y="238" text-anchor="middle" font-size="18" fill="#6b6b6b">「誰の何か」をタップ</text>

<line x1="715" y1="210" x2="795" y2="210" stroke="#b9933f" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="800" y="140" width="280" height="140" rx="16" fill="#fffdf9" stroke="#c0414a" stroke-width="3"/>
<text x="940" y="200" text-anchor="middle" font-size="24" fill="#c0414a" font-weight="bold">③ 図ができる</text>
<text x="940" y="238" text-anchor="middle" font-size="18" fill="#6b6b6b">自動でつながる</text>

<!-- branch down -->
<line x1="940" y1="280" x2="940" y2="330" stroke="#e4ddcf" stroke-width="3"/>
<line x1="550" y1="330" x2="1070" y2="330" stroke="#e4ddcf" stroke-width="3"/>
<line x1="550" y1="330" x2="550" y2="380" stroke="#e4ddcf" stroke-width="3"/>
<line x1="810" y1="330" x2="810" y2="380" stroke="#e4ddcf" stroke-width="3"/>
<line x1="1070" y1="330" x2="1070" y2="380" stroke="#e4ddcf" stroke-width="3"/>

<rect x="430" y="390" width="240" height="200" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="550" y="470" text-anchor="middle" font-size="42">🕸️</text>
<text x="550" y="530" text-anchor="middle" font-size="23" fill="#2b2622" font-weight="bold">相関図</text>
<text x="550" y="560" text-anchor="middle" font-size="17" fill="#6b6b6b">誰が誰の何か</text>

<rect x="690" y="390" width="240" height="200" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="810" y="470" text-anchor="middle" font-size="42">🌳</text>
<text x="810" y="530" text-anchor="middle" font-size="23" fill="#2b2622" font-weight="bold">家系図</text>
<text x="810" y="560" text-anchor="middle" font-size="17" fill="#6b6b6b">世代が縦に並ぶ</text>

<rect x="950" y="390" width="240" height="200" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="1070" y="470" text-anchor="middle" font-size="42">📄</text>
<text x="1070" y="530" text-anchor="middle" font-size="23" fill="#2b2622" font-weight="bold">名簿・PDF</text>
<text x="1070" y="560" text-anchor="middle" font-size="17" fill="#6b6b6b">選んだ人だけ書き出し</text>

<text x="600" y="640" text-anchor="middle" font-size="19" fill="#6b6b6b">住所も電話番号も、覚えていなければ入れなくてよい</text>
</svg>

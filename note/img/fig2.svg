<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#b9933f"/>
</marker>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>
<text x="600" y="62" text-anchor="middle" font-size="44" fill="#2b2b2b" font-weight="bold">やることは、3つだけ</text>

<!-- step 1 -->
<rect x="50" y="90" width="1100" height="86" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="600" y="145" text-anchor="middle" font-size="42" fill="#2b2622" font-weight="bold">① 人を登録する</text>

<path d="M600 176 L600 208" stroke="#b9933f" stroke-width="6" marker-end="url(#arrow)"/>

<!-- step 2 -->
<rect x="50" y="212" width="1100" height="86" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="600" y="267" text-anchor="middle" font-size="42" fill="#2b2622" font-weight="bold">② 関係を選ぶ</text>

<path d="M600 298 L600 330" stroke="#b9933f" stroke-width="6" marker-end="url(#arrow)"/>

<!-- step 3 -->
<rect x="50" y="334" width="1100" height="86" rx="16" fill="#fffdf9" stroke="#c0414a" stroke-width="4"/>
<text x="600" y="389" text-anchor="middle" font-size="42" fill="#c0414a" font-weight="bold">③ 図ができる</text>

<path d="M600 420 L600 452" stroke="#b9933f" stroke-width="6" marker-end="url(#arrow)"/>

<!-- 3 outputs -->
<rect x="50" y="456" width="340" height="140" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="220" y="530" text-anchor="middle" font-size="50">🕸️</text>
<text x="220" y="580" text-anchor="middle" font-size="36" fill="#2b2622" font-weight="bold">相関図</text>

<rect x="430" y="456" width="340" height="140" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="600" y="530" text-anchor="middle" font-size="50">🌳</text>
<text x="600" y="580" text-anchor="middle" font-size="36" fill="#2b2622" font-weight="bold">家系図</text>

<rect x="810" y="456" width="340" height="140" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="980" y="530" text-anchor="middle" font-size="50">📄</text>
<text x="980" y="580" text-anchor="middle" font-size="36" fill="#2b2622" font-weight="bold">名簿・PDF</text>

<text x="600" y="635" text-anchor="middle" font-size="28" fill="#6b6b6b">住所も電話番号も、なくてよい</text>
</svg>

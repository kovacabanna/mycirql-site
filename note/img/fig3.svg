<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
<marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#b9933f"/>
</marker>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>

<!-- top: 相関図 -->
<text x="600" y="48" text-anchor="middle" font-size="26" fill="#2b2b2b" font-weight="bold">選ぶだけで、線がつながる</text>

<g stroke="#b9933f" stroke-width="3">
  <line x1="600" y1="180" x2="440" y2="110"/>
  <line x1="600" y1="180" x2="760" y2="110"/>
  <line x1="600" y1="180" x2="380" y2="200"/>
  <line x1="600" y1="180" x2="820" y2="200"/>
  <line x1="600" y1="180" x2="440" y2="270"/>
  <line x1="600" y1="180" x2="760" y2="270"/>
</g>

<circle cx="600" cy="180" r="34" fill="#c0414a"/>
<text x="600" y="188" text-anchor="middle" font-size="17" fill="#fffdf9" font-weight="bold">中心</text>

<g font-size="15" fill="#2b2622">
  <circle cx="440" cy="110" r="26" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="440" y="116" text-anchor="middle" font-weight="bold">父</text>
  <circle cx="760" cy="110" r="26" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="760" y="116" text-anchor="middle" font-weight="bold">母</text>
  <circle cx="380" cy="200" r="26" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="380" y="206" text-anchor="middle" font-weight="bold">妻</text>
  <circle cx="820" cy="200" r="26" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="820" y="206" text-anchor="middle" font-weight="bold">長女</text>
  <circle cx="440" cy="270" r="26" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="440" y="276" text-anchor="middle" font-weight="bold">友人</text>
  <circle cx="760" cy="270" r="26" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="760" y="276" text-anchor="middle" font-weight="bold">取引先</text>
</g>

<line x1="60" y1="330" x2="1140" y2="330" stroke="#e4ddcf" stroke-width="2"/>

<!-- bottom: question flow -->
<text x="600" y="372" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold">タップで答えるだけで、図が育つ</text>

<rect x="70" y="410" width="290" height="150" rx="20" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="215" y="465" text-anchor="middle" font-size="19" fill="#2b2622" font-weight="bold">Aさんを選ぶ</text>
<text x="215" y="500" text-anchor="middle" font-size="16" fill="#6b6b6b">名前をタップするだけ</text>

<path d="M365 485 L420 485" stroke="#b9933f" stroke-width="4" marker-end="url(#arrow3)"/>

<rect x="425" y="410" width="330" height="150" rx="20" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="590" y="455" text-anchor="middle" font-size="19" fill="#2b2622" font-weight="bold">Bさんとの関係は？</text>
<text x="590" y="486" text-anchor="middle" font-size="16" fill="#6b6b6b">「姉」「弟」などを選択肢からタップ</text>
<text x="590" y="514" text-anchor="middle" font-size="16" fill="#6b6b6b">（文字入力なし）</text>

<path d="M760 485 L815 485" stroke="#b9933f" stroke-width="4" marker-end="url(#arrow3)"/>

<rect x="820" y="410" width="310" height="150" rx="20" fill="#fffdf9" stroke="#c0414a" stroke-width="3"/>
<text x="975" y="455" text-anchor="middle" font-size="19" fill="#c0414a" font-weight="bold">両親は？</text>
<text x="975" y="486" text-anchor="middle" font-size="16" fill="#2b2b2b">「父ですか？母ですか？」</text>
<text x="975" y="514" text-anchor="middle" font-size="16" fill="#2b2b2b">さらに質問が続く</text>

<text x="600" y="625" text-anchor="middle" font-size="20" fill="#c0414a" font-weight="bold">文字入力ゼロ</text>
</svg>

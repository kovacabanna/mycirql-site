<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>

<text x="600" y="46" text-anchor="middle" font-size="40" fill="#2b2b2b" font-weight="bold">選ぶだけで、線がつながる</text>
<text x="600" y="76" text-anchor="middle" font-size="26" fill="#b9933f">アプリ内ではこの画面を「ハブ」と呼んでいる（自転車の車輪のイメージ）</text>

<g stroke="#b9933f" stroke-width="4">
  <line x1="600" y1="210" x2="461" y2="130"/>
  <line x1="600" y1="210" x2="739" y2="130"/>
  <line x1="600" y1="210" x2="440" y2="210"/>
  <line x1="600" y1="210" x2="760" y2="210"/>
  <line x1="600" y1="210" x2="461" y2="290"/>
  <line x1="600" y1="210" x2="739" y2="290"/>
</g>

<circle cx="600" cy="210" r="48" fill="#c0414a"/>
<text x="600" y="220" text-anchor="middle" font-size="26" fill="#fffdf9" font-weight="bold">ハブ</text>

<g font-size="28" fill="#2b2622" font-weight="bold">
  <circle cx="461" cy="130" r="44" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="461" y="140" text-anchor="middle">父</text>
  <circle cx="739" cy="130" r="44" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="739" y="140" text-anchor="middle">母</text>
  <circle cx="440" cy="210" r="44" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="440" y="220" text-anchor="middle">妻</text>
  <circle cx="760" cy="210" r="44" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="760" y="220" text-anchor="middle">長女</text>
  <circle cx="461" cy="290" r="44" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="461" y="300" text-anchor="middle">友人</text>
  <circle cx="739" cy="290" r="44" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="739" y="300" text-anchor="middle">取引先</text>
</g>

<line x1="60" y1="345" x2="1140" y2="345" stroke="#e4ddcf" stroke-width="2"/>

<text x="600" y="385" text-anchor="middle" font-size="34" fill="#2b2b2b" font-weight="bold">タップで答えるだけで、図が育つ</text>

<g font-size="32" fill="#2b2622" font-weight="bold">
  <rect x="60" y="410" width="1080" height="62" rx="14" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <circle cx="105" cy="441" r="24" fill="#e4ddcf"/>
  <text x="105" y="450" text-anchor="middle" font-size="24">①</text>
  <text x="150" y="452">Aさんを選ぶ</text>

  <rect x="60" y="484" width="1080" height="62" rx="14" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <circle cx="105" cy="515" r="24" fill="#e4ddcf"/>
  <text x="105" y="524" text-anchor="middle" font-size="24">②</text>
  <text x="150" y="526">関係をタップで選ぶ（文字入力なし）</text>

  <rect x="60" y="558" width="1080" height="62" rx="14" fill="#fffdf9" stroke="#c0414a" stroke-width="3"/>
  <circle cx="105" cy="589" r="24" fill="#f3dadc"/>
  <text x="105" y="598" text-anchor="middle" font-size="24" fill="#c0414a">③</text>
  <text x="150" y="600" fill="#c0414a">両親も聞かれたらタップ</text>
</g>

<text x="600" y="655" text-anchor="middle" font-size="34" fill="#c0414a" font-weight="bold">文字入力ゼロ</text>
</svg>

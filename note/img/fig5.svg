<path d="M360 460 L500 460" stroke="#b9933f" stroke-width="5" marker-end="url(#arrow5)"/>

<rect x="520" y="400" width="230" height="120" rx="14" fill="#fffdf9" stroke="#b9933f" stroke-width="3"/>
<text x="635" y="450" text-anchor="middle" font-size="30">📄</text>
<text x="635" y="490" text-anchor="middle" font-size="19" fill="#2b2622" font-weight="bold">CSV / PDF</text>

<rect x="800" y="380" width="280" height="200" rx="14" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="940" y="420" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">名簿の中身</text>

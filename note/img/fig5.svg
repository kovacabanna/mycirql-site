<text x="600" y="345" text-anchor="middle" font-size="24" fill="#2b2b2b" font-weight="bold">選んだ人だけ、名簿になる</text>

<g>
  <rect x="120" y="380" width="220" height="60" rx="10" fill="#fffdf9" stroke="#3c9460" stroke-width="2"/>
  <rect x="140" y="398" width="24" height="24" rx="4" fill="#3c9460"/>

<!-- pins -->
<circle cx="460" cy="220" r="20" fill="#3c9460"/>
<text x="460" y="226" text-anchor="middle" font-size="14" fill="#fffdf9">🎂</text>
<text x="460" y="270" text-anchor="middle" font-size="14" fill="#2b2622">誕生日</text>

<circle cx="732" cy="220" r="20" fill="#c0414a"/>

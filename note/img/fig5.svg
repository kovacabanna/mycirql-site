  <line x1="120" y1="150" x2="1080" y2="150"/>
  <line x1="256" y1="90" x2="256" y2="290"/>
  <line x1="392" y1="90" x2="392" y2="290"/>
  <line x1="528" y1="90" x2="528" y2="290"/>
  <line x1="664" y1="90" x2="664" y2="290"/>
  <line x1="800" y1="90" x2="800" y2="290"/>
  <line x1="936" y1="90" x2="936" y2="290"/>
</g>
<text x="188" y="130" text-anchor="middle" font-size="15" fill="#6b6b6b">月</text>
<text x="324" y="130" text-anchor="middle" font-size="15" fill="#6b6b6b">火</text>
<text x="460" y="130" text-anchor="middle" font-size="15" fill="#6b6b6b">水</text>

<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
<marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#b9933f"/>
</marker>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>
<text x="600" y="60" text-anchor="middle" font-size="28" fill="#2b2b2b" font-weight="bold">続柄を選ぶだけで、家系図になる</text>

<!-- left: input -->
<rect x="50" y="100" width="380" height="500" rx="18" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="240" y="150" text-anchor="middle" font-size="20" fill="#6b6b6b">続柄を選んだもの</text>

<circle cx="140" cy="230" r="30" fill="#e4ddcf"/>
<text x="140" y="237" text-anchor="middle" font-size="15">父</text>
<circle cx="340" cy="230" r="30" fill="#e4ddcf"/>
<text x="340" y="237" text-anchor="middle" font-size="15">母</text>
<line x1="170" y1="230" x2="310" y2="230" stroke="#c0414a" stroke-width="3"/>
<text x="240" y="216" text-anchor="middle" font-size="15" fill="#c0414a">夫婦</text>

<circle cx="240" cy="360" r="30" fill="#e4ddcf"/>
<text x="240" y="367" text-anchor="middle" font-size="15">長男</text>
<line x1="240" y1="260" x2="240" y2="330" stroke="#3c9460" stroke-width="3"/>
<text x="285" y="300" text-anchor="middle" font-size="15" fill="#3c9460">親子</text>

<circle cx="140" cy="470" r="30" fill="#e4ddcf"/>
<text x="140" y="477" text-anchor="middle" font-size="15">妻</text>
<line x1="200" y1="390" x2="150" y2="440" stroke="#c0414a" stroke-width="3"/>

<circle cx="340" cy="470" r="30" fill="#e4ddcf"/>
<text x="340" y="477" text-anchor="middle" font-size="14">長女</text>
<line x1="260" y1="390" x2="330" y2="440" stroke="#b9933f" stroke-width="3" stroke-dasharray="2 5"/>
<text x="330" y="410" text-anchor="middle" font-size="13" fill="#b9933f">兄弟姉妹</text>

<text x="240" y="560" text-anchor="middle" font-size="16" fill="#6b6b6b">「親子」「夫婦」「兄弟姉妹」</text>
<text x="240" y="582" text-anchor="middle" font-size="16" fill="#6b6b6b">続柄を選ぶだけ</text>

<!-- arrow -->
<path d="M450 350 L560 350" stroke="#b9933f" stroke-width="5" marker-end="url(#arrow4)"/>
<text x="505" y="330" text-anchor="middle" font-size="18" fill="#b9933f" font-weight="bold">自動で</text>

<!-- right: output family tree -->
<rect x="580" y="100" width="570" height="500" rx="18" fill="#fffdf9" stroke="#c0414a" stroke-width="3"/>
<text x="865" y="150" text-anchor="middle" font-size="20" fill="#c0414a" font-weight="bold">できあがった家系図</text>

<!-- gen1 -->
<circle cx="800" cy="220" r="28" fill="#e4ddcf"/>
<text x="800" y="227" text-anchor="middle" font-size="14">父</text>
<circle cx="930" cy="220" r="28" fill="#e4ddcf"/>
<text x="930" y="227" text-anchor="middle" font-size="14">母</text>
<line x1="828" y1="220" x2="902" y2="220" stroke="#e4ddcf" stroke-width="3"/>

<!-- gen line -->
<line x1="865" y1="248" x2="865" y2="300" stroke="#e4ddcf" stroke-width="3"/>
<line x1="750" y1="300" x2="980" y2="300" stroke="#e4ddcf" stroke-width="3"/>
<line x1="750" y1="300" x2="750" y2="340" stroke="#e4ddcf" stroke-width="3"/>
<line x1="980" y1="300" x2="980" y2="340" stroke="#e4ddcf" stroke-width="3"/>

<!-- gen2 -->
<circle cx="750" cy="370" r="28" fill="#e4ddcf"/>
<text x="750" y="366" text-anchor="middle" font-size="12">長男</text>
<text x="750" y="382" text-anchor="middle" font-size="11" fill="#6b6b6b">1st</text>
<circle cx="850" cy="370" r="28" fill="#f3dadc"/>
<text x="850" y="377" text-anchor="middle" font-size="13" fill="#c0414a">妻</text>
<line x1="778" y1="370" x2="822" y2="370" stroke="#e4ddcf" stroke-width="3"/>

<circle cx="980" cy="370" r="28" fill="#e4ddcf"/>
<text x="980" y="366" text-anchor="middle" font-size="12">長女</text>
<text x="980" y="382" text-anchor="middle" font-size="11" fill="#6b6b6b">2nd</text>

<!-- gen3 -->
<line x1="810" y1="398" x2="810" y2="440" stroke="#e4ddcf" stroke-width="3"/>
<circle cx="810" cy="470" r="26" fill="#e4ddcf"/>
<text x="810" y="466" text-anchor="middle" font-size="12">孫</text>
<text x="810" y="482" text-anchor="middle" font-size="10" fill="#6b6b6b">1st</text>

<text x="865" y="560" text-anchor="middle" font-size="17" fill="#6b6b6b">世代が縦にそろい、長男・長女の順で並ぶ</text>

</svg>

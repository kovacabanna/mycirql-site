<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
<marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#b9933f"/>
</marker>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>
<text x="600" y="38" text-anchor="middle" font-size="34" fill="#2b2b2b" font-weight="bold">続柄を選ぶだけで、家系図になる</text>

<!-- top: input -->
<rect x="50" y="54" width="1100" height="248" rx="18" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
<text x="85" y="90" font-size="24" fill="#6b6b6b">続柄を選んだもの</text>

<circle cx="300" cy="150" r="34" fill="#e4ddcf"/>
<text x="300" y="159" text-anchor="middle" font-size="24" font-weight="bold">父</text>
<circle cx="480" cy="150" r="34" fill="#e4ddcf"/>
<text x="480" y="159" text-anchor="middle" font-size="24" font-weight="bold">母</text>
<line x1="334" y1="150" x2="446" y2="150" stroke="#c0414a" stroke-width="4"/>
<text x="390" y="136" text-anchor="middle" font-size="22" fill="#c0414a" font-weight="bold">夫婦</text>

<circle cx="390" cy="255" r="34" fill="#e4ddcf"/>
<text x="390" y="264" text-anchor="middle" font-size="22" font-weight="bold">長男</text>
<line x1="390" y1="184" x2="390" y2="221" stroke="#3c9460" stroke-width="4"/>
<text x="452" y="207" font-size="22" fill="#3c9460" font-weight="bold">親子</text>

<circle cx="630" cy="255" r="34" fill="#e4ddcf"/>
<text x="630" y="264" text-anchor="middle" font-size="22" font-weight="bold">長女</text>
<line x1="424" y1="255" x2="596" y2="255" stroke="#b9933f" stroke-width="4" stroke-dasharray="3 7"/>
<text x="510" y="285" text-anchor="middle" font-size="22" fill="#b9933f" font-weight="bold">兄弟姉妹</text>

<text x="850" y="140" text-anchor="middle" font-size="24" fill="#6b6b6b">「親子」「夫婦」</text>
<text x="850" y="174" text-anchor="middle" font-size="24" fill="#6b6b6b">「兄弟姉妹」など</text>
<text x="850" y="208" text-anchor="middle" font-size="24" fill="#6b6b6b">続柄を選ぶだけ</text>

<!-- arrow -->
<path d="M600 302 L600 336" stroke="#b9933f" stroke-width="6" marker-end="url(#arrow4)"/>
<text x="670" y="326" font-size="26" fill="#b9933f" font-weight="bold">自動で</text>

<!-- bottom: output family tree -->
<rect x="50" y="342" width="1100" height="322" rx="18" fill="#fffdf9" stroke="#c0414a" stroke-width="4"/>
<text x="600" y="382" text-anchor="middle" font-size="28" fill="#c0414a" font-weight="bold">できあがった家系図</text>

<!-- gen1 -->
<circle cx="530" cy="440" r="32" fill="#e4ddcf"/>
<text x="530" y="449" text-anchor="middle" font-size="22" font-weight="bold">父</text>
<circle cx="670" cy="440" r="32" fill="#e4ddcf"/>
<text x="670" y="449" text-anchor="middle" font-size="22" font-weight="bold">母</text>
<line x1="562" y1="440" x2="638" y2="440" stroke="#e4ddcf" stroke-width="4"/>

<line x1="600" y1="472" x2="600" y2="495" stroke="#e4ddcf" stroke-width="4"/>
<line x1="440" y1="495" x2="770" y2="495" stroke="#e4ddcf" stroke-width="4"/>
<line x1="440" y1="495" x2="440" y2="518" stroke="#e4ddcf" stroke-width="4"/>
<line x1="770" y1="495" x2="770" y2="518" stroke="#e4ddcf" stroke-width="4"/>

<!-- gen2 -->
<circle cx="440" cy="552" r="32" fill="#e4ddcf"/>
<text x="440" y="548" text-anchor="middle" font-size="18" font-weight="bold">長男</text>
<text x="440" y="566" text-anchor="middle" font-size="14" fill="#6b6b6b">1st</text>
<circle cx="550" cy="552" r="32" fill="#f3dadc"/>
<text x="550" y="560" text-anchor="middle" font-size="20" fill="#c0414a" font-weight="bold">妻</text>
<line x1="472" y1="552" x2="518" y2="552" stroke="#e4ddcf" stroke-width="4"/>

<circle cx="770" cy="552" r="32" fill="#e4ddcf"/>
<text x="770" y="548" text-anchor="middle" font-size="18" font-weight="bold">長女</text>
<text x="770" y="566" text-anchor="middle" font-size="14" fill="#6b6b6b">2nd</text>

<!-- gen3 -->
<line x1="495" y1="584" x2="495" y2="606" stroke="#e4ddcf" stroke-width="4"/>
<circle cx="495" cy="636" r="30" fill="#e4ddcf"/>
<text x="495" y="632" text-anchor="middle" font-size="17" font-weight="bold">孫</text>
<text x="495" y="650" text-anchor="middle" font-size="13" fill="#6b6b6b">1st</text>

<text x="950" y="500" text-anchor="middle" font-size="24" fill="#6b6b6b">世代が縦にそろい、</text>
<text x="950" y="534" text-anchor="middle" font-size="24" fill="#6b6b6b">長男・長女の順で</text>
<text x="950" y="568" text-anchor="middle" font-size="24" fill="#6b6b6b">並ぶ</text>
</svg>

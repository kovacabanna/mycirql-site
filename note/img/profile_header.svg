<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
</defs>
<rect width="1600" height="400" fill="#f7f3ec"/>

<!-- wheel motif bleeding off right edge -->
<g>
  <circle cx="1560" cy="200" r="240" fill="none" stroke="#b9933f" stroke-width="10"/>
  <g stroke="#ddceac" stroke-width="3">
    <line x1="1560" y1="200" x2="1560" y2="-24"/>
    <line x1="1560" y1="200" x2="1727" y2="33"/>
    <line x1="1560" y1="200" x2="1800" y2="200"/>
    <line x1="1560" y1="200" x2="1727" y2="367"/>
    <line x1="1560" y1="200" x2="1560" y2="424"/>
    <line x1="1560" y1="200" x2="1393" y2="367"/>
    <line x1="1560" y1="200" x2="1320" y2="200"/>
    <line x1="1560" y1="200" x2="1393" y2="33"/>
  </g>
  <circle cx="1560" cy="200" r="56" fill="#c0414a"/>
  <circle cx="1560" cy="200" r="27" fill="none" stroke="#fffdf9" stroke-width="9"/>
</g>

<!-- text (kept clear of bottom-left, where note overlays the profile icon) -->
<text x="90" y="175" font-size="64" fill="#2b2622" font-weight="bold">喪主、はじめました。</text>
<text x="90" y="220" font-size="24" fill="#6b6b6b">遠い親戚も、疎遠な人も、ついでに弔いごとも。</text>
</svg>

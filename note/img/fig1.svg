<rect width="1200" height="675" fill="#f7f3ec"/>
<text x="600" y="72" text-anchor="middle" font-size="46" fill="#2b2b2b" font-weight="bold">「わからない」には、4種類あった</text>

<!-- row template: rect 40..1160, height 100 -->
<g>
  <rect x="40" y="140" width="1120" height="100" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <circle cx="120" cy="190" r="42" fill="#e4ddcf"/>
  <text x="120" y="203" text-anchor="middle" font-size="38" fill="#6b6b6b">？</text>
  <text x="200" y="203" font-size="40" fill="#2b2622" font-weight="bold">その1：名前も顔もわからない</text>
</g>

<g>
  <rect x="40" y="255" width="1120" height="100" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <circle cx="120" cy="305" r="42" fill="#e4ddcf"/>
  <path d="M96 296 q24 -22 48 0 M96 316 q24 20 48 0" stroke="#6b6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="200" y="318" font-size="40" fill="#2b2622" font-weight="bold">その2：顔はわかるが、名前がわからない</text>
</g>

<g>
  <rect x="40" y="370" width="1120" height="100" rx="16" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <circle cx="120" cy="420" r="42" fill="#e4ddcf"/>
  <text x="120" y="431" text-anchor="middle" font-size="28" fill="#6b6b6b">田中</text>
  <text x="200" y="433" font-size="40" fill="#2b2622" font-weight="bold">その3：名前はわかるが、顔と一致しない</text>
</g>

<g>
  <rect x="40" y="485" width="1120" height="110" rx="16" fill="#fffdf9" stroke="#c0414a" stroke-width="4"/>
  <circle cx="120" cy="540" r="42" fill="#f3dadc"/>
  <text x="120" y="551" text-anchor="middle" font-size="28" fill="#c0414a">田中</text>
  <text x="200" y="552" font-size="42" fill="#c0414a" font-weight="bold">その4：血縁関係だけ、わからない</text>
</g>

<text x="600" y="645" text-anchor="middle" font-size="30" fill="#6b6b6b">連絡先アプリには、この4つを書く場所がない</text>

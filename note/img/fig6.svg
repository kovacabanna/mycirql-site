<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>text{font-family:"IPAGothic","IPAPGothic",sans-serif;}</style>
</defs>
<rect width="1200" height="675" fill="#f7f3ec"/>
<text x="600" y="60" text-anchor="middle" font-size="28" fill="#2b2b2b" font-weight="bold">あなたの情報は、外に出ない</text>

<!-- inner boundary -->
<rect x="250" y="110" width="700" height="330" rx="24" fill="#fffdf9" stroke="#3c9460" stroke-width="3" stroke-dasharray="10 6"/>
<text x="600" y="145" text-anchor="middle" font-size="17" fill="#3c9460" font-weight="bold">この中だけに保存される</text>

<!-- iPhone -->
<rect x="330" y="190" width="130" height="220" rx="18" fill="#2b2622"/>
<rect x="342" y="212" width="106" height="176" rx="4" fill="#fffdf9"/>
<circle cx="395" cy="368" r="10" fill="#6b6b6b"/>
<text x="395" y="440" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">あなたの端末</text>

<!-- lock -->
<g transform="translate(575,255)">
  <rect x="-28" y="0" width="56" height="46" rx="8" fill="#b9933f"/>
  <path d="M-16 0 v-14 a16 16 0 0 1 32 0 v14" stroke="#b9933f" stroke-width="8" fill="none"/>
  <circle cx="0" cy="22" r="6" fill="#fffdf9"/>
</g>
<text x="575" y="330" text-anchor="middle" font-size="15" fill="#6b6b6b">開発者も</text>
<text x="575" y="352" text-anchor="middle" font-size="15" fill="#6b6b6b">中身を見れない</text>

<!-- iCloud -->
<g transform="translate(800,270)">
  <path d="M-90 20 a40 40 0 0 1 4 -79 a55 55 0 0 1 106 10 a35 35 0 0 1 -6 69 z" fill="#e4ddcf"/>
  <text x="0" y="10" text-anchor="middle" font-size="16" fill="#2b2622" font-weight="bold">iCloud</text>
</g>
<text x="800" y="380" text-anchor="middle" font-size="17" fill="#2b2622" font-weight="bold">あなた自身のiCloud</text>

<!-- outside crossed out -->
<g font-size="16" fill="#9a917f">
  <rect x="60" y="470" width="200" height="70" rx="12" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="160" y="512" text-anchor="middle">開発者のサーバー</text>
  <line x1="70" y1="480" x2="250" y2="530" stroke="#c0414a" stroke-width="3"/>
  <line x1="70" y1="530" x2="250" y2="480" stroke="#c0414a" stroke-width="3"/>

  <rect x="500" y="470" width="200" height="70" rx="12" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="600" y="512" text-anchor="middle">SNS</text>
  <line x1="510" y1="480" x2="690" y2="530" stroke="#c0414a" stroke-width="3"/>
  <line x1="510" y1="530" x2="690" y2="480" stroke="#c0414a" stroke-width="3"/>

  <rect x="940" y="470" width="200" height="70" rx="12" fill="#fffdf9" stroke="#e4ddcf" stroke-width="2"/>
  <text x="1040" y="512" text-anchor="middle">広告会社</text>
  <line x1="950" y1="480" x2="1130" y2="530" stroke="#c0414a" stroke-width="3"/>
  <line x1="950" y1="530" x2="1130" y2="480" stroke="#c0414a" stroke-width="3"/>
</g>

<text x="600" y="605" text-anchor="middle" font-size="15" fill="#6b6b6b">※ 郵便番号から住所を調べるときだけ、外部の住所サービスに郵便番号を送ります</text>
<text x="600" y="632" text-anchor="middle" font-size="15" fill="#6b6b6b">それ以外にデータが外へ出ることはありません</text>
</svg>
